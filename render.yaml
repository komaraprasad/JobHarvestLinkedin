# Render Blueprint: New + > Blueprint > pick this repo. Set DATABASE_URL (Neon) when Render asks for it.
services:
  - type: web
    name: jobharvest
    runtime: python
    plan: free
    region: singapore     # same region as the Neon database (ap-southeast-1) and close to India
    buildCommand: pip install -r requirements.txt
    # ONE worker on purpose: the run lock and limits live in this process. Threads serve the dashboard + extension.
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/ext/history
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
