<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn Jobs Saver</title>
<style>
:root{--bg:#fff;--ink:#16202e;--muted:#5d6b7e;--line:#e2e7ef;--soft:#f1f4f9;--brand:#1f5fbf;--ok:#17804a;--ok-soft:#e5f5ec;--warn:#9a5b00;--warn-soft:#fff4e0;--bad:#b42318;--bad-soft:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#171e29;--ink:#e6ebf2;--muted:#94a1b3;--line:#273142;--soft:#1d2533;--brand:#5b93e6;--ok:#5cc58b;--ok-soft:#14301f;--warn:#f0b54d;--warn-soft:#33270f;--bad:#f2786d;--bad-soft:#3a1714}}
*{box-sizing:border-box}
body{margin:0;width:380px;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.logo{width:24px;height:24px;border-radius:6px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
header b{font-size:14px}.count{margin-left:auto;font-size:12px;color:var(--muted)}
section{padding:12px 14px}
.job{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.job h3{margin:0 0 2px;font-size:14px}.job .co{color:var(--muted)}
dl{display:grid;grid-template-columns:96px 1fr;gap:3px 8px;margin:8px 0 0;font-size:12px}
dt{color:var(--muted)}dd{margin:0;word-break:break-word}
.blank{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--soft);color:var(--muted)}
.msg{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:12px;display:none}
.msg.ok{display:block;background:var(--ok-soft);color:var(--ok)}
.msg.warn{display:block;background:var(--warn-soft);color:var(--warn)}
.msg.bad{display:block;background:var(--bad-soft);color:var(--bad)}
button{font:inherit;font-weight:600;border-radius:8px;padding:9px 12px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;width:100%;margin-top:10px}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px}.row button{flex:1}
.danger{color:var(--bad)}
ul{list-style:none;margin:0;padding:0;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px}
li{display:flex;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font-size:12px}
li:first-child{border-top:0}li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li button{padding:2px 7px;font-size:11px}
.empty{padding:10px;color:var(--muted);text-align:center;font-size:12px}
.foot{font-size:11px;color:var(--muted);padding:0 14px 12px}
h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
</style>
</head>
<body>
<header><div class="logo">J</div><b>LinkedIn Jobs Saver</b><span class="count" id="count">0 saved</span></header>
<section>
  <h4>Job on this tab</h4>
  <div class="job" id="job"><div class="empty">Reading the page…</div></div>
  <button class="primary" id="save" disabled>Save this job</button>
  <div class="msg" id="msg"></div>
</section>
<section style="padding-top:0">
  <h4>Saved jobs</h4>
  <ul id="list"></ul>
  <div class="row" style="margin-top:10px">
    <button id="xlsx">⬇ Excel</button><button id="csv">⬇ CSV</button><button id="clear" class="danger">Clear all</button>
  </div>
</section>
<div class="foot">Reads only the page you are viewing, when you open this popup. It never browses, scrolls or sends requests by itself.</div>
<script src="export.js"></script>
<script src="popup.js"></script>
</body>
</html>
